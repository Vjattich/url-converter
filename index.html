                        if(!o.allp && p.required !== true) return;
                        return paramArgs("RequestParam", p.name, gen.type(sch, p.name, false), p.required === true, dflt);
                    }
                    if(p.in === "header"){
                        var lk = String(p.name).toLowerCase();
                        if(NOISE_HEADERS[lk] || /^(sec-|x-forwarded-)/.test(lk)) return;
                        return paramArgs("RequestHeader", p.name, gen.type(sch, p.name, false), p.required === true, dflt);
                    }
                    if(p.in === "cookie"){
                        if(o.trimNoise) return;           // cookies copied from a browser are session noise
                        return paramArgs("CookieValue", p.name, gen.type(sch, p.name, false), p.required === true, dflt);
                    }
                    if(p.in === "body") return arg("@RequestBody", gen.type(p.schema, Hint + "Request", false), "body");
                    if(p.in === "formData"){
                        consumes = consumes || (p.type === "file" ? "multipart/form-data" : null);
                        return paramArgs("RequestParam", p.name, gen.type(p, p.name, true), p.required === true, dflt);
                    }
                });

                var rb = deref(doc, op.requestBody);
                var body = rb && rb.content ? pickContent(rb.content) : null;
                if(body){
                    var ct = body.ct.split(";")[0].trim().toLowerCase(), media = deref(doc, body.media) || {};
                    if(/multipart|x-www-form-urlencoded/.test(ct)){
                        consumes = ct;
                        var info = gen.propsOf(media.schema || {});
                        Object.keys(info.props).forEach(function(k){
                            var ps = info.props[k], d = deref(doc, ps) || {};
                            var t = gen.type(ps, k, true), req = info.req.indexOf(k) >= 0;
                            var structured = /multipart/.test(ct) && !/MultipartFile/.test(t) && (d.properties || ps.$ref && !d.enum && d.type !== "string");
                            if(structured) arg("@RequestPart" + (req ? "(" + jstr(k) + ")" : "(value = " + jstr(k) + ", required = false)"), t, k);
                            else paramArgs("RequestParam", k, t, req, d.default !== undefined ? asText(d.default) : undefined);
                        });
                    } else {
                        if(!/json/.test(ct)) consumes = ct;
                        var bt = /^text\//.test(ct) && !(media.schema && (deref(doc, media.schema) || {}).type === "object") ? "String"
                            : gen.type(media.schema || { type: "string", format: "binary" }, Hint + "Request", false);
                        var bn = /^[A-Z]\w*$/.test(bt) && !/^(String|Object|Integer|Long|Boolean|BigDecimal)$/.test(bt) ? bt : "body";
                        arg(rb.required === false ? "@RequestBody(required = false)" : "@RequestBody", bt, bn);
                    }
                }

                // first 2xx response decides the return type
                var codes = Object.keys(op.responses || {}).filter(function(c){ return /^2/.test(c); }).sort();
                var code = codes[0] || "200", ret = "void", produces = null;
                var resp = deref(doc, (op.responses || {})[code]);
                var rc = resp && resp.content ? pickContent(resp.content) : null;
                if(rc){
                    var rm = deref(doc, rc.media) || {};
                    if(!/json|\*/.test(rc.ct)) produces = rc.ct;
                    ret = rm.schema ? gen.type(rm.schema, Hint + "Response", false) : (/^text\//.test(rc.ct) ? "String" : "Object");
                } else if(resp && resp.schema){                                     // swagger 2
                    ret = gen.type(resp.schema, Hint + "Response", false);
                }

                var attrs = [jstr(pathKey)];
                if(consumes) attrs.push("consumes = " + mediaArg(consumes));
                if(produces) attrs.push("produces = " + mediaArg(produces));
                var annLine;
                if(VERB_ANN[verb]) annLine = "@" + VERB_ANN[verb] + "(" + (attrs.length > 1 ? "value = " + attrs.join(", ") : attrs[0]) + ")";
                else annLine = "@RequestMapping(value = " + attrs.concat(["method = RequestMethod." + verb.toUpperCase()]).join(", ") + ")";

                var out = [];
                if(o.desc){
                    var doclines = [];
                    if(op.summary) doclines.push(String(op.summary).split("\n")[0]);
                    if(op.description) String(op.description).replace(/\s+$/, "").split("\n").forEach(function(l){ doclines.push(l); });
                    if(doclines.length){
                        out.push("/**");
                        doclines.forEach(function(l){ out.push((" * " + l).replace(/\s+$/, "")); });
                        out.push(" */");
                    }
                    if(op.deprecated === true) out.push("@Deprecated");
                }
                out.push(annLine);
                if(STATUS_NAMES[code] && !codes.some(function(c){ return c === "200"; })) out.push("@ResponseStatus(HttpStatus." + STATUS_NAMES[code] + ")");
                var sig = "public " + ret + " " + mname + "(";
                var one = sig + args.join(", ") + ") {";
                if(one.length + 4 <= 120 || args.length < 2) out.push(one);
                else {
                    var pad = " ".repeat(sig.length);
                    out.push(sig + args[0] + ",");
                    args.slice(1).forEach(function(a, k){ out.push(pad + a + (k === args.length - 2 ? ") {" : ",")); });
                }
                out.push(ret === "void" ? "}" : "    return null;\n}");
                methods.push(out.join("\n"));
            });
        });

        if(!methods.length) return { text: "", count: 0, warns: ["no operations to turn into Spring methods"] };

        // a class around the methods only when something names it; otherwise just the methods and their DTOs
        var cname = o.controller || null;
        var dtos = [];
        if(cname) gen.taken[cname] = 1;
        for(var k = 0; k < gen.classes.length; k++) dtos.push(gen.classText(gen.classes[k]));   // may queue more classes
        var code = cname
            ? "@RestController\npublic class " + cname + " {\n\n" + methods.map(function(m){
            return m.split("\n").map(function(l){ return l ? "    " + l : l; }).join("\n");
        }).join("\n\n") + "\n}"
            : methods.join("\n\n");
        return { text: code + (dtos.length ? "\n\n" + dtos.join("\n\n") : "") + "\n", count: methods.length, warns: warns };
    }


    /* =================== detect + convert =================== */

    var DEFAULTS = {
        host:false, query:false, name:true,                                           // curl + .http
        body:true, desc:true, allp:true, vars:false, accept:true, auth:true, ohost:true, // openapi
        hostVar:"host", nameValue:""
    };

    function detectMode(text){
        var t = text.trim();
        if(!t) return null;
        var f = "";
        var ls = t.split("\n");
        for(var j = 0; j < ls.length; j++){
            var s = ls[j].trim();
            if(!s || (/^(#|\/\/)/.test(s) && !/^###/.test(s))) continue;
            f = s; break;
        }
        if(/^(?:[\w.\/\\:-]*[\/\\])?curl(?:\.exe)?(?:\s|$)/i.test(f)) return "curl";
        if(/^###/.test(f) || METHOD_RE.test(f) || /^@[\w.-]+\s*=/.test(f) || /^(https?:\/\/|\{\{)\S*$/i.test(f)) return "http";
        if(/(^|\n)\s*(?:[\w./\\-]*\/)?curl(?:\.exe)?[\s'"]/i.test("\n" + t)) return "curl";
        if(/^\s*"?(openapi|swagger)"?\s*:/mi.test(t)) return "openapi";
        if(/^\s*"?paths"?\s*:/mi.test(t)) return "openapi";
        if(SPRING_MAPPING.test(t)) return "spring";
        if(/^\s*"?\/[^\s:"]*"?\s*:\s*\{?\s*$/m.test(t)) return "openapi";
        if(/^\s*(get|post|put|patch|delete|head|options):\s*$/mi.test(t)) return "openapi";
        if(t[0] === "{") return "openapi";
        return "unknown";
    }

    function sameName(auto){ return auto || ""; }

    function uniq(list){ return list.filter(function(w, i, a){ return w && a.indexOf(w) === i; }); }

    function runCurl(src, o){
        var groups;
        try{ groups = splitCurls(tokenize(src)); }
        catch(e){ return { text:"", count:0, err: String(e && e.message || e) }; }
        if(!groups.length){
            return { text:"", count:0, err:"No curl found. The command has to start with `curl`." };
        }
        var warns = [], blocks = [];
        groups.forEach(function(g){
            var req = parseCurl(g);
            if(!req.url){ warns.push("one command had no URL, skipped"); return; }
            req.url = unshell(req.url);
            req.headers = req.headers.map(function(h){ return [h[0], unshell(h[1])]; });
            req.warnings.forEach(function(w){ warns.push("ignored " + w); });
            blocks.push(render(req, o));
        });
        return {
            text: blocks.join("\n\n"),
            count: blocks.length,
            cnt: groups.length > 1 ? groups.length + " commands" : "",
            err: uniq(warns).join(" · ")
        };
    }

    function pathCountOf(doc){
        var paths = doc && typeof doc.paths === "object" && doc.paths ? doc.paths : doc;
        if(!paths || typeof paths !== "object") return "";
        var n = Object.keys(paths).filter(function(k){ return k.indexOf("/") === 0; }).length;
        return n ? n + (n > 1 ? " paths" : " path") : "";
    }

    function readSpec(src){
        var doc;
        try{ doc = parseSpec(src); }
        catch(e){ return { err: "Could not read the spec: " + (e && e.message || e) }; }
        if(!doc) return { err: "Could not read the spec." };
        return { doc: doc };
    }

    // an OpenAPI doc from either a pasted spec or Spring controller code
    function specOf(src, mode){
        if(mode !== "spring") return readSpec(src);
        try{ return springToOpenApi(src); }
        catch(e){ return { err: "Could not read the Java code: " + (e && e.message || e) }; }
    }

    function specCnt(s){
        if(!s.doc.openapi || s.count === undefined) return pathCountOf(s.doc);
        return s.count > 1 ? s.count + " endpoints" : "";
    }

    function runOpenApi(src, o, mode){
        var s = specOf(src, mode);
        if(s.err) return { text:"", count:0, err: s.err };
        // a bare method has no class to name the file after
        var doc = mode === "spring" && !s.titled ? Object.assign({}, s.doc, { info: null }) : s.doc;
        var res = openApiToHttp(doc, o);
        var warns = (s.warns || []).concat(noFieldsWarn(s.bodyUnknown || []), res.warnings);
        return { text: res.text, count: res.count, cnt: specCnt(s), err: uniq(warns).join(" · ") };
    }

    /* convert(source, detected mode, "http" | "curl" | "openapi", options) -> { text, count, cnt, err } */
    function convert(src, mode, target, opt){
        opt = Object.assign({}, DEFAULTS, opt);
        var nameIdx = 0;
        function nameFor(auto){
            var i = nameIdx++;
            if(opt.nameValue) return i ? opt.nameValue + "-" + (i + 1) : opt.nameValue;
            return auto || "";
        }
        if(mode === "unknown"){
            return { text:"", count:0, err:"Can't tell the format. Paste a curl command, IDEA .http requests, an OpenAPI spec or Spring controller code." };
        }
        var specIn = mode === "openapi" || mode === "spring";
        var fin = Object.assign({}, opt, { host: specIn ? opt.ohost : opt.host, nameFor: nameFor });

        if(specIn && target === "spring"){
            var ss = specOf(src, mode);
            if(ss.err) return { text:"", count:0, err: ss.err };
            var title = ss.doc.info && ss.doc.info.title;
            var named = mode === "spring" ? ss.titled && /^[A-Za-z_$][\w$]*$/.test(title) : /^[A-Z][\w$]*Controller$/.test(title || "");
            var sr = openApiToSpring(ss.doc, Object.assign({}, fin, { controller: controllerDirective(src) || (named ? title : null) }));
            var sw2 = (ss.warns || []).concat(noFieldsWarn(ss.unknown || []), sr.warns);
            return { text: sr.text, count: sr.count, cnt: specCnt(ss), err: uniq(sw2).join(" · ") };
        }

        if(specIn && target === "openapi"){
            var s = specOf(src, mode);
            if(s.err) return { text:"", count:0, err: s.err };
            var ops = 0, p = s.doc.paths || s.doc;
            if(p && typeof p === "object") Object.keys(p).forEach(function(k){
                if(p[k] && typeof p[k] === "object") HTTP_METHODS.forEach(function(m){ if(p[k][m]) ops++; });
            });
            var sw = (s.warns || []).concat(noFieldsWarn(s.unknown || []));
            return { text: dumpYaml(s.doc), count: ops, cnt: specCnt(s), err: uniq(sw).join(" · ") };
        }

        if(target === "http"){
            if(mode === "curl") return runCurl(src, fin);
            if(specIn) return runOpenApi(src, fin, mode);
            var hm = parseHttp(src);
            if(!hm.reqs.length) return { text:"", count:0, err:"No request line found." };
            return { text: httpFromModel(hm, fin), count: hm.reqs.length, cnt: hm.reqs.length > 1 ? hm.reqs.length + " requests" : "" };
        }

        var model, cnt = "", warn = "";
        if(mode === "http"){
            model = parseHttp(src);
            cnt = model.reqs.length > 1 ? model.reqs.length + " requests" : "";
        } else {
            // go through .http first, host and names are applied at the end
            var mid = Object.assign({}, opt, { host:false, ohost:false, query:false, name:true, nameFor: sameName });
            var r = mode === "curl" ? runCurl(src, mid) : runOpenApi(src, mid, mode);
            if(!r.text) return r;
            model = parseHttp(r.text);
            cnt = r.cnt; warn = r.err;
        }
        if(!model.reqs.length) return { text:"", count:0, cnt: cnt, err: warn || "No requests found." };
        var res;
        if(target === "spring"){
            var oa = toOpenApi(model, fin);
            var sp = oa.count ? openApiToSpring(oa.doc, Object.assign({}, fin, { trimNoise: true, controller: controllerDirective(src) }))
                : { text:"", count:0, warns:[] };
            res = { text: sp.text, count: sp.count, warns: oa.warns.concat(sp.warns) };
        } else res = target === "curl" ? toCurl(model, fin) : toOpenApi(model, fin);
        return { text: res.text, count: res.count, cnt: cnt, err: uniq([warn].concat(res.warns)).join(" · ") };
    }

    /* =================== /CORE =================== */
</script>

<script>
    (function(){
        "use strict";

        /* =================== UI =================== */

        var $ = function(s){ return document.querySelector(s); };
        var srcEl = $("#src"), outEl = $("#out");

        var OPT = Object.assign({}, DEFAULTS);
        var TARGET = "http";
        var SRC = null;
        var STORE = "curl-to-http.v2";
        try{
            var saved = JSON.parse(localStorage.getItem(STORE) || "{}");
            if(saved.hostVar) OPT.hostVar = saved.hostVar;
            if(["http","curl","openapi","spring"].indexOf(saved.target) >= 0) TARGET = saved.target;
        }catch(_){}
        function persist(){
            try{ localStorage.setItem(STORE, JSON.stringify({ hostVar: OPT.hostVar, target: TARGET })); }catch(_){}
        }

        var SEGS = {
            curl: ["host","query","name"],
            http: ["host","query","name"],
            openapi: ["body","desc","allp","accept","auth","vars","ohost","query","name"],
            spring: ["body","desc","allp","accept","vars","ohost","query","name"]
        };
        var DROP = { http: [], curl: ["query","name"], openapi: ["query"],
            spring: ["host","ohost","query","name","vars","accept","body","auth"] };
        var HOLD = { host: "host", ohost: "host", name: "name" };
        var FILES = { http: "requests.http", curl: "requests.sh", openapi: "openapi.yaml", spring: "Controller.java" };

        function labelOf(key){
            if(HOLD[key] === "host") return "{{" + OPT.hostVar + "}}";
            if(key === "name") return OPT.nameValue ? "@name " + OPT.nameValue : "@name";
            return { body:"body", desc:"notes", allp:"optional", accept:"accept", auth:"auth", vars:"{{vars}}", query:"query" }[key];
        }

        /* ---------- toggles, with hold-to-edit on host and @name ---------- */

        function segKeys(){
            if((SRC === "openapi" || SRC === "spring") && TARGET === "openapi") return [];
            var drop = DROP[TARGET];
            return SEGS[SEGS[SRC] ? SRC : "http"].filter(function(k){ return drop.indexOf(k) < 0; });
        }

        function buildSeg(){
            var seg = $("#seg");
            seg.innerHTML = '<span class="lbl">out</span>';
            var keys = segKeys();
            seg.hidden = !keys.length;
            keys.forEach(function(key){
                var b = document.createElement("button");
                b.type = "button";
                b.textContent = labelOf(key);
                b.setAttribute("aria-pressed", String(!!OPT[key]));
                var hold = HOLD[key], timer = null, held = false;
                if(hold){
                    b.classList.add("hold");
                    b.title = hold === "host" ? "Hold (or right-click) to rename the host variable"
                        : "Hold (or right-click) to set the request name";
                    b.addEventListener("pointerdown", function(e){
                        if(e.button !== 0) return;
                        held = false;
                        clearTimeout(timer);
                        timer = setTimeout(function(){ held = true; openPop(b, key); }, 450);
                    });
                    ["pointerup","pointerleave","pointercancel"].forEach(function(ev){
                        b.addEventListener(ev, function(){ clearTimeout(timer); });
                    });
                    b.addEventListener("contextmenu", function(e){
                        e.preventDefault();
                        clearTimeout(timer);
                        if(!held) openPop(b, key);
                    });
                }
                b.addEventListener("click", function(e){
                    if(held){ held = false; return; }
                    if(hold && e.altKey){ openPop(b, key); return; }
                    OPT[key] = !OPT[key];
                    b.setAttribute("aria-pressed", String(OPT[key]));
                    run();
                });
                seg.appendChild(b);
            });
        }

        var pop = $("#pop"), popIn = $("#pop-i"), popKey = null;

        function openPop(btn, key){
            popKey = key;
            var isHost = HOLD[key] === "host";
            $("#pop-l").textContent = isHost ? "Host variable" : "Request name";
            $("#pop-h").textContent = isHost ? "Becomes {{name}} in place of scheme and host"
                : "Leave empty for names from the path. Extra requests get -2, -3";
            popIn.value = isHost ? OPT.hostVar : OPT.nameValue;
            popIn.placeholder = isHost ? "host" : "from the path";
            pop.hidden = false;
            var r = btn.getBoundingClientRect();
            pop.style.left = Math.max(8, Math.min(r.left, window.innerWidth - pop.offsetWidth - 8)) + "px";
            pop.style.top = (r.bottom + 6) + "px";
            popIn.focus();
            popIn.select();
        }

        function closePop(commit){
            if(pop.hidden) return;
            var key = popKey;
            pop.hidden = true;
            popKey = null;
            if(commit){
                var v = popIn.value.trim().replace(/\s+/g, "-").replace(/[^\p{L}\p{N}_.-]/gu, "");
                if(HOLD[key] === "host"){ OPT.hostVar = v || "host"; OPT[key] = true; persist(); }
                else { OPT.nameValue = v; if(v) OPT.name = true; }
            }
            buildSeg();
            run();
        }

        popIn.addEventListener("keydown", function(e){
            if(e.key === "Enter"){ e.preventDefault(); closePop(true); }
            else if(e.key === "Escape"){ e.preventDefault(); closePop(false); }
        });
        popIn.addEventListener("blur", function(){ closePop(true); });

        function markFmt(mode){
            var f = $("#fmts");
            f.classList.toggle("known", !!mode && mode !== "unknown");
            f.querySelectorAll("[data-f]").forEach(function(s){ s.classList.toggle("on", s.getAttribute("data-f") === mode); });
        }

        /* ---------- file parts: a + on every file line of the output ---------- */

        var PICKS = {};      // "request:part:n" -> [{ name, type }]
        var plusEl = $("#pluses"), fpick = $("#fpick"), pickKey = null, LINE_KEYS = [];

        // file parts in the output, keyed by request number + part name so picks survive toggles
        function fileParts(text){
            var lines = text.split("\n"), parts = [], req = 0, seen = {};
            var key = function(name){
                var k = req + ":" + name;
                seen[k] = (seen[k] || 0) + 1;
                return k + ":" + seen[k];
            };
            if(TARGET === "curl"){
                lines.forEach(function(l, i){
                    if(/^curl\b/.test(l)) req++;
                    var m = /-F '([^'=]+)=@/.exec(l);
                    if(m) parts.push({ key: key(m[1]), name: m[1], start: i, end: i + 1, files: 1 });
                });
            } else if(TARGET === "http"){
                lines.forEach(function(l, i){
                    if(/^###/.test(l)) req++;
                    var m = /^Content-Disposition:.*?\bname="([^"]*)".*\bfilename=/i.exec(l);
                    if(!m) return;
                    var start = i, end = i + 1;
                    while(start > 0 && !/^--\S/.test(lines[start])) start--;
                    while(end < lines.length && !/^--\S/.test(lines[end])) end++;
                    var files = lines.slice(i, end).filter(function(x){ return /^<\s/.test(x); }).length;
                    parts.push({ key: key(m[1]), name: m[1], start: start, end: end, bline: lines[start], files: files });
                });
            }
            return parts;
        }

        // swaps picked files into their parts; LINE_KEYS gets the part key of each file line, top to bottom
        function applyPicks(text, parts){
            var lines = text.split("\n");
            LINE_KEYS = [];
            parts.forEach(function(p){
                var n = PICKS[p.key] ? PICKS[p.key].length : p.files;
                for(var k = 0; k < n; k++) LINE_KEYS.push(p.key);
            });
            parts.slice().reverse().forEach(function(p){
                var files = PICKS[p.key];
                if(!files) return;
                var out = [];
                if(TARGET === "curl"){
                    var l = lines[p.start], indent = l.match(/^\s*/)[0], cont = / \\$/.test(l) ? " \\" : "";
                    files.forEach(function(f, n){
                        out.push(indent + "-F " + sq(p.name + "=@" + (f.path || "./" + f.name) + (f.type ? ";type=" + f.type : ""))
                            + (n < files.length - 1 ? " \\" : cont));
                    });
                } else {
                    files.forEach(function(f){
                        out.push(p.bline, 'Content-Disposition: form-data; name="' + p.name + '"; filename="' + f.name.replace(/"/g, "%22") + '"');
                        if(f.type) out.push("Content-Type: " + f.type);
                        out.push("", "< " + (f.path || "./" + f.name));
                    });
                }
                lines.splice.apply(lines, [p.start, p.end - p.start].concat(out));
            });
            return lines.join("\n");
        }

        // line numbers of the file lines in what's in the output box now (it can be edited by hand)
        function fileLineNos(text){
            var lines = text.split("\n"), nos = [], inFile = false;
            lines.forEach(function(l, i){
                if(TARGET === "curl"){ if(/-F '[^'=]+=@/.test(l)) nos.push(i); return; }
                if(/^--\S/.test(l)){ inFile = false; return; }
                if(/^Content-Disposition:.*\bfilename=/i.test(l)){ inFile = true; return; }
                if(inFile && /^<\s/.test(l)) nos.push(i);
            });
            return nos;
        }

        var measureCtx = document.createElement("canvas").getContext("2d");
        function placePluses(){
            plusEl.innerHTML = "";
            var nos = fileLineNos(outEl.value);
            if(!nos.length || !LINE_KEYS.length) return;
            var cs = getComputedStyle(outEl);
            var lh = parseFloat(cs.lineHeight) || 19.5, padT = parseFloat(cs.paddingTop), padL = parseFloat(cs.paddingLeft);
            measureCtx.font = cs.fontStyle + " " + cs.fontWeight + " " + cs.fontSize + " " + cs.fontFamily;
            var lines = outEl.value.split("\n"), viewH = outEl.clientHeight, viewW = outEl.clientWidth;
            plusEl.style.width = viewW + "px";
            plusEl.style.height = viewH + "px";
            nos.forEach(function(i, idx){
                var key = LINE_KEYS[idx];
                if(!key) return;
                var top = padT + i * lh - outEl.scrollTop + (lh - 17) / 2;
                if(top < -17 || top > viewH) return;
                var picked = PICKS[key];
                var b = document.createElement("button");
                b.type = "button";
                b.textContent = "+";
                b.title = "Copy the files' paths first (Explorer: Ctrl+Shift+C), then click to put them here.\n" +
                    "With no paths copied it opens a file picker, which only knows file names.";
                b.setAttribute("aria-label", "Pick files for " + key.split(":")[1]);
                b.setAttribute("aria-pressed", String(!!picked));
                b.style.top = top + "px";
                b.style.left = (padL + measureCtx.measureText(lines[i]).width - outEl.scrollLeft + 10) + "px";
                b.onclick = function(){ pickFiles(key); };
                plusEl.appendChild(b);
            });
        }

        var MIME = { pdf:"application/pdf", xml:"application/xml", json:"application/json", txt:"text/plain", csv:"text/csv",
            html:"text/html", htm:"text/html", png:"image/png", jpg:"image/jpeg", jpeg:"image/jpeg", gif:"image/gif",
            svg:"image/svg+xml", webp:"image/webp", zip:"application/zip", gz:"application/gzip", "7z":"application/x-7z-compressed",
            doc:"application/msword", docx:"application/vnd.openxmlformats-officedocument.wordprocessingml.document",
            xls:"application/vnd.ms-excel", xlsx:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
            rtf:"application/rtf", odt:"application/vnd.oasis.opendocument.text", tif:"image/tiff", tiff:"image/tiff",
            sig:"application/pkcs7-signature", p7s:"application/pkcs7-signature", sgn:"application/pkcs7-signature" };

        // full paths copied from the file manager: Explorer's "Copy as path", file:// URIs, or plain paths, one per line
        function pathsFrom(text){
            var lines = String(text || "").split(/\r?\n/).map(function(l){ return l.trim().replace(/^"(.*)"$/, "$1"); }).filter(Boolean);
            if(!lines.length || lines.length > 500) return null;
            var paths = [];
            for(var k = 0; k < lines.length; k++){
                var l = lines[k];
                if(/^file:\/\//i.test(l)){
                    try{ l = decodeURIComponent(l.replace(/^file:\/\/(localhost)?/i, "")).replace(/^\/([A-Za-z]:)/, "$1"); }catch(_){ return null; }
                }
                if(!/^([A-Za-z]:[\\\/]|\\\\|\/|~\/)/.test(l) || /[\r\n<>|]/.test(l)) return null;
                paths.push(l.replace(/\\/g, "/").replace(/^\/\/(?=[^/])/, "\\\\"));
            }
            return paths.map(function(path){
                var name = path.split("/").pop();
                var ext = (/\.([^.]+)$/.exec(name) || [])[1];
                return { name: name, type: ext ? MIME[ext.toLowerCase()] || "" : "", path: path };
            });
        }

        async function pickFiles(key){
            var text = null;
            try{ if(navigator.clipboard && navigator.clipboard.readText) text = await navigator.clipboard.readText(); }catch(_){}
            var files = pathsFrom(text);
            if(files){
                PICKS[key] = files;
                run();
                toast(files.length > 1 ? files.length + " paths added" : "Path added");
                return;
            }
            pickKey = key; fpick.value = ""; fpick.click();
        }

        fpick.addEventListener("change", function(){
            var list = Array.prototype.slice.call(fpick.files || []);
            if(!pickKey || !list.length) return;
            PICKS[pickKey] = list.map(function(f){ return { name: f.name, type: f.type }; });
            pickKey = null;
            run();
        });

        outEl.addEventListener("scroll", placePluses);
        outEl.addEventListener("input", placePluses);
        if(window.ResizeObserver) new ResizeObserver(placePluses).observe(outEl);
        else window.addEventListener("resize", placePluses);

        function run(){
            var text = srcEl.value;
            var mode = text.trim() ? detectMode(text) : null;
            if(mode !== SRC){ SRC = mode; buildSeg(); }
            markFmt(mode);
            if(!mode){
                outEl.value = ""; $("#err").textContent = "";
                $("#cnt").textContent = ""; $("#ocnt").textContent = "";
                LINE_KEYS = []; placePluses();
                return;
            }
            var r;
            try{ r = convert(text, mode, TARGET, OPT); }
            catch(e){ r = { text:"", count:0, err:"Conversion failed: " + (e && e.message || e) }; }
            var parts = fileParts(r.text || "");
            LINE_KEYS = [];
            outEl.value = parts.length ? applyPicks(r.text, parts) : (r.text || "");
            placePluses();
            $("#cnt").textContent = r.cnt || "";
            var unit = TARGET === "openapi" ? "operation" : TARGET === "spring" ? "endpoint" : "request";
            $("#ocnt").textContent = r.count ? r.count + " " + unit + (r.count > 1 ? "s" : "") : "";
            $("#err").textContent = r.err || "";
        }

        var timer = null;
        srcEl.addEventListener("input", function(){
            clearTimeout(timer);
            timer = setTimeout(run, 120);
        });

        var sel = $("#target");
        var tbtns = Array.prototype.slice.call(document.querySelectorAll("#tfmts [data-t]"));
        function showTarget(){
            sel.value = TARGET;
            tbtns.forEach(function(b){ b.setAttribute("aria-checked", String(b.getAttribute("data-t") === TARGET)); });
        }
        function setTarget(v){
            if(v === TARGET) return;
            TARGET = v;
            showTarget();
            persist();
            buildSeg();
            run();
        }
        showTarget();
        sel.addEventListener("change", function(){ setTarget(sel.value); });
        tbtns.forEach(function(b){ b.addEventListener("click", function(){ setTarget(b.getAttribute("data-t")); }); });

        $("#clear").onclick = function(){ srcEl.value = ""; PICKS = {}; run(); srcEl.focus(); };

        /* ---------- clipboard: buttons and keys ---------- */

        var toastTimer = null;
        function toast(msg){
            var t = $("#toast");
            t.textContent = msg; t.classList.add("on");
            clearTimeout(toastTimer);
            toastTimer = setTimeout(function(){ t.classList.remove("on"); }, 1400);
        }

        async function copyOut(){
            var text = outEl.value;
            if(!text){ toast("Nothing to copy yet"); return; }
            try{ await navigator.clipboard.writeText(text); toast("Copied"); return; }
            catch(_){}
            var back = document.activeElement, ok = false;
            outEl.focus(); outEl.select();
            try{ ok = document.execCommand("copy"); }catch(_){}
            outEl.setSelectionRange(0, 0);
            if(back && back.focus) back.focus();
            toast(ok ? "Copied" : "Clipboard unavailable");
        }

        function hasSelection(){
            var a = document.activeElement;
            if(a && (a.tagName === "TEXTAREA" || a.tagName === "INPUT") &&
                typeof a.selectionStart === "number" && a.selectionStart !== a.selectionEnd) return true;
            var s = window.getSelection && window.getSelection();
            return !!(s && String(s).length);
        }

        $("#copy").onclick = copyOut;

        // Ctrl+C with nothing selected copies the result (KeyC so it works on any layout)
        document.addEventListener("keydown", function(e){
            if(!(e.ctrlKey || e.metaKey) || e.altKey || e.shiftKey || e.code !== "KeyC") return;
            if(hasSelection()) return;
            e.preventDefault();
            copyOut();
        });

        // Ctrl+V anywhere outside the input replaces the input
        document.addEventListener("paste", function(e){
            if(e.target === srcEl || e.target === popIn) return;
            var text = e.clipboardData && e.clipboardData.getData("text");
            if(!text) return;
            e.preventDefault();
            srcEl.value = text;
            clearTimeout(timer);
            run();
            toast("Pasted into input");
        });

        function anchorSave(text, name){
            var url = URL.createObjectURL(new Blob([text], {type:"text/plain;charset=utf-8"}));
            var a = document.createElement("a");
            a.href = url; a.download = name;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(function(){ URL.revokeObjectURL(url); }, 0);
        }

        function saveProblem(e){
            var code = e && e.code;
            if(code === "declined") return "Save cancelled";
            if(code === "rate_limited") return "A save prompt is already open";
            if(code === "too_large") return "Too big to save, copy it instead";
            return "Saving is unavailable here, use Copy";
        }

        $("#save").onclick = async function(){
            var text = outEl.value;
            if(!text) return;
            var name = FILES[TARGET];
            if(!downloads){ anchorSave(text, name); toast("Saved " + name); return; }
            try{
                await downloads.save({ filename: name, data: text });
                toast("Saved " + name);
            }catch(e){
                if(e && e.code === "rejected_extension"){
                    try{
                        await downloads.save({ filename: name + ".txt", data: text });
                        toast("Saved as " + name + ".txt, drop the .txt");
                    }catch(e2){ toast(saveProblem(e2)); }
                    return;
                }
                toast(saveProblem(e));
            }
        };

        buildSeg();
        run();
        srcEl.focus();
    })();
</script>
<script src="footer.js" data-repo="https://github.com/Vjattich/url-converter"></script>
</body>
