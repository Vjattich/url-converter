<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>curl ⇄ OpenAPI ⇄ .http ⇄ Spring</title>
    <style>
        :root{
            --orange: orange;
            --orange-deep:#e5651a;
            --ink:#1b120a;
            --ink-2:#241809;
            --paper:#fff3e2;
            --line:rgba(27,18,10,.22);
            --mono:"JetBrains Mono","SFMono-Regular",Menlo,Consolas,monospace;
        }
        *{box-sizing:border-box}
        html,body{margin:0}
        body{
            background:var(--orange);
            color:var(--ink);
            font-family:var(--mono);
            font-size:13px;
            line-height:1.5;
            padding:22px 18px 70px;   /* bottom: room for the fixed footer from footer.js */
            min-height:100vh;
            min-height:100dvh;
            display:grid;
            grid-template-rows:auto 1fr;
        }
        header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;width:100%;max-width:1560px;margin:0 auto 18px}
        h1{font-size:19px;margin:0;letter-spacing:-.4px;font-weight:700}
        .wrap{width:100%;max-width:1560px;margin:0 auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:stretch}
        .panel{background:var(--paper);border:1.5px solid var(--ink);border-radius:3px;box-shadow:5px 5px 0 rgba(27,18,10,.35);overflow:hidden;
            display:flex;flex-direction:column;min-height:440px}
        .panel > h2{
            margin:0;padding:7px 11px;font-size:11px;letter-spacing:1.4px;text-transform:uppercase;
            background:var(--ink);color:var(--orange);font-weight:600;display:flex;justify-content:space-between;gap:10px;align-items:center
        }
        textarea{
            width:100%;flex:1 1 auto;min-height:0;border:0;padding:11px;resize:none;
            font:inherit;background:transparent;color:var(--ink);outline:none;white-space:pre;overflow-wrap:normal;overflow-x:auto
        }
        .bar{display:flex;gap:8px;padding:9px 11px;flex-wrap:wrap;align-items:center}
        button{
            font:inherit;font-weight:600;cursor:pointer;border:1.5px solid var(--ink);background:var(--paper);color:var(--ink);
            padding:5px 12px;border-radius:2px;transition:transform .06s,background .12s
        }
        button:hover{background:var(--orange)}
        button:active{transform:translateY(1px)}
        button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
        .seg{display:flex;gap:6px;padding:8px 11px;border-bottom:1.5px solid var(--line);align-items:center;flex-wrap:wrap}
        .seg button{padding:4px 10px;font-size:11px;letter-spacing:.6px}
        .seg button[aria-pressed=true]{background:var(--ink);color:var(--orange)}
        .seg .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.8px;opacity:.7}
        #out{tab-size:2}
        .err{background:#7a1d0c;color:#ffd9c9;padding:9px 11px;font-size:12px}
        .err:empty{display:none}
        .toast{position:fixed;bottom:66px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--orange);
            padding:8px 16px;border-radius:2px;opacity:0;pointer-events:none;transition:opacity .18s;font-size:12px;z-index:9}
        .toast.on{opacity:1}
        #cnt,#ocnt{font-size:10px;font-weight:400;letter-spacing:0;text-transform:none;opacity:.8}
        #tfmts button{
            font:inherit;font-size:inherit;letter-spacing:inherit;text-transform:inherit;font-weight:inherit;
            background:none;border:0;padding:0;color:inherit;cursor:pointer;opacity:.4;transition:opacity .12s
        }
        #tfmts button:hover{background:none;opacity:.75}
        #tfmts button[aria-checked=true]{opacity:1;text-decoration:underline;text-underline-offset:3px}
        #tfmts button:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
        #target{display:none}
        @media(max-width:600px){#tfmts{display:none}#target{display:inline-block}}
        .panel > h2 select{
            font:inherit;font-size:11px;letter-spacing:1.4px;text-transform:uppercase;font-weight:600;cursor:pointer;
            background:var(--ink);color:var(--orange);border:1.5px solid var(--orange);border-radius:2px;padding:1px 4px
        }
        .panel > h2 select:focus-visible{outline:2px solid var(--paper);outline-offset:2px}
        #fmts.known span[data-f]{opacity:.4}
        #fmts.known span.on{opacity:1;text-decoration:underline;text-underline-offset:3px}
        .seg[hidden]{display:none}
        .outwrap{position:relative;flex:1 1 auto;min-height:0;display:flex}
        .pluses{position:absolute;inset:0;overflow:hidden;pointer-events:none}
        .pluses button{position:absolute;pointer-events:auto;padding:0 6px;font-size:11px;line-height:15px;height:17px;
            max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .pluses button[aria-pressed=true]{background:var(--ink);color:var(--orange)}
        .seg button{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
        .seg button.hold{position:relative}
        .seg button.hold::after{content:"";position:absolute;right:2px;bottom:2px;border-left:4px solid transparent;border-bottom:4px solid currentColor;opacity:.55}
        .pop{position:fixed;z-index:10;background:var(--paper);border:1.5px solid var(--ink);box-shadow:4px 4px 0 rgba(27,18,10,.35);
            padding:9px;display:flex;flex-direction:column;gap:5px;width:250px}
        .pop[hidden]{display:none}
        .pop label{font-size:11px;font-weight:600}
        .pop input{font:inherit;border:1.5px solid var(--ink);background:#fff;color:var(--ink);padding:4px 6px;border-radius:2px;outline:none}
        .pop input:focus-visible{box-shadow:0 0 0 2px var(--orange)}
        .pop small{font-size:10px;opacity:.7;line-height:1.35}
        @media(max-width:1080px){.wrap{grid-template-columns:1fr;align-content:start}.panel{height:440px;min-height:0}}
        @media(prefers-reduced-motion:reduce){*{transition:none!important}}
    </style>
</head>
<body>

<header>
    <h1>OpenAPI ⇄ curl ⇄ .http ⇄ Spring</h1>
</header>

<div class="wrap">
    <section class="panel">
        <h2><span id="fmts"><span data-f="openapi">OpenAPI</span>, <span data-f="curl">curl</span>, <span data-f="http">.http</span>, <span data-f="spring">Spring</span></span> <span id="cnt"></span>
            <button id="clear" type="button" style="padding:2px 9px;font-size:11px">Clear</button>
        </h2>
        <label for="src"></label><textarea id="src" spellcheck="false" placeholder="Ctrl+V"></textarea>
    </section>

    <section class="panel">
        <h2><span id="tfmts" role="radiogroup" aria-label="Output format"><button type="button" role="radio" data-t="openapi">OpenAPI</button>, <button type="button" role="radio" data-t="curl">curl</button>, <button type="button" role="radio" data-t="http">.http</button>, <button type="button" role="radio" data-t="spring">Spring</button></span><select id="target" aria-label="Output format">
            <option value="http">.http</option>
            <option value="curl">curl</option>
            <option value="openapi">OpenAPI</option>
            <option value="spring">Spring</option>
        </select> <span id="ocnt"></span>
            <span style="display:flex;gap:6px;align-items:center">
        <button id="save" style="padding:2px 9px;font-size:11px">Save</button>
        <button id="copy" style="padding:2px 9px;font-size:11px">Copy</button>
      </span>
        </h2>
        <div class="seg" id="seg"><span class="lbl">out</span></div>
        <input type="file" id="fpick" multiple hidden>
        <div class="outwrap">
            <label for="out"></label><textarea id="out" placeholder="Ctrl+C" spellcheck="false"></textarea>
            <div class="pluses" id="pluses"></div>
        </div>
        <div class="err" id="err"></div>
    </section>
</div>

<div class="pop" id="pop" hidden>
    <label for="pop-i" id="pop-l"></label>
    <input id="pop-i" spellcheck="false" autocomplete="off">
    <small id="pop-h"></small>
</div>

<div class="toast" id="toast"></div>

<script>
    "use strict";

    /* =================== CORE =================== */

    /* ---------- shell tokenizer ---------- */

    function ansiC(src, i) {
        let out = "";
        while (i < src.length && src[i] !== "'") {
            if (src[i] !== "\\") { out += src[i++]; continue; }
            i++;
            const c = src[i++];
            const hex = (max) => {
                let h = "";
                while (h.length < max && /[0-9a-fA-F]/.test(src[i] || "")) h += src[i++];
                return h ? String.fromCodePoint(parseInt(h, 16)) : "";
            };
            switch (c) {
                case "a": out += "\x07"; break;
                case "b": out += "\b"; break;
                case "e": case "E": out += "\x1b"; break;
                case "f": out += "\f"; break;
                case "n": out += "\n"; break;
                case "r": out += "\r"; break;
                case "t": out += "\t"; break;
                case "v": out += "\v"; break;
                case "\\": out += "\\"; break;
                case "'": out += "'"; break;
                case '"': out += '"'; break;
                case "?": out += "?"; break;
                case "x": out += hex(2); break;
                case "u": out += hex(4); break;
                case "U": out += hex(8); break;
                default:
                    if (/[0-7]/.test(c)) {
                        let o = c;
                        while (o.length < 3 && /[0-7]/.test(src[i] || "")) o += src[i++];
                        out += String.fromCharCode(parseInt(o, 8));
                    } else if (c !== undefined) out += c;
            }
        }
        return { text: out, end: i + 1 };
    }

    /* ---------- cmd.exe ("Copy as cURL (Windows)" in Firefox / Chrome) ---------- */

    function looksLikeCmd(src) {
        return /(?:^|\s)\^"/.test(src) || /[ \t]\^[ \t]*\r?\n/.test(src);
    }
    // (whose first char is then literal, so ^<nl><nl> is a newline inside a value)
    function cmdUnescape(src) {
        const s = src.replace(/\r\n?/g, "\n");
        let out = "", q = false;
        for (let i = 0; i < s.length; i++) {
            const c = s[i];
            if (c === "\n") { q = false; out += c; continue; }
            if (c === '"') { q = !q; out += c; continue; }
            if (q) { out += c; continue; }
            if (c === "&" || c === "|") { out += "\n"; continue; }        // command separators
            if (c !== "^") { out += c; continue; }
            if (/^[ \t]*\n/.test(s.slice(i + 1, i + 40)) && s[i + 1] !== "\n") {
                i = s.indexOf("\n", i);                                    // "^   " + newline
            } else if (s[i + 1] === "\n") i++;
            if (i + 1 < s.length) out += s[++i];
        }
        return out;
    }

    function crtSplit(s) {
        const toks = [];
        let cur = "", has = false, q = false;
        for (let i = 0; i < s.length; i++) {
            const c = s[i];
            if (c === "\\") {
                let n = 0;
                while (s[i] === "\\") { n++; i++; }
                has = true;
                if (s[i] === '"') {
                    cur += "\\".repeat(n >> 1);
                    if (n & 1) { cur += '"'; continue; }
                } else cur += "\\".repeat(n);
                i--; continue;
            }
            if (c === '"') {
                if (q && s[i + 1] === '"') { cur += '"'; i++; continue; }
                q = !q; has = true; continue;
            }
            if (!q && /\s/.test(c)) { if (has) { toks.push(cur); cur = ""; has = false; } continue; }
            cur += c; has = true;
        }
        if (has) toks.push(cur);
        return toks;
    }

    function tokenize(src) {
        if (looksLikeCmd(src)) return crtSplit(cmdUnescape(src));
        const toks = [];
        let i = 0, cur = "", has = false;
        const n = src.length;
        const push = () => { if (has) { toks.push(cur); cur = ""; has = false; } };
        while (i < n) {
            const c = src[i];
            if (c === "^" && src[i + 1] === "\n") { i += 2; continue; }          // cmd.exe
            if (c === "`" && src[i + 1] === "\n") { i += 2; continue; }          // powershell
            if (c === "\\" && (src[i + 1] === "\n" || (src[i + 1] === "\r" && src[i + 2] === "\n"))) {
                i += src[i + 1] === "\r" ? 3 : 2; continue;
            }
            if (c === " " || c === "\t" || c === "\n" || c === "\r") { push(); i++; continue; }
            if (c === "#" && !has) { while (i < n && src[i] !== "\n") i++; continue; }      // shell comment
            if (c === "'") {
                has = true; i++;
                while (i < n && src[i] !== "'") cur += src[i++];
                i++; continue;
            }
            if (c === '"') {
                has = true; i++;
                while (i < n && src[i] !== '"') {
                    if (src[i] === "\\" && '"\\$`\n'.indexOf(src[i + 1]) >= 0) {
                        if (src[i + 1] === "\n") { i += 2; continue; }
                        cur += src[i + 1]; i += 2; continue;
                    }
                    cur += src[i++];
                }
                i++; continue;
            }
            if (c === "$" && src[i + 1] === "'") {
                has = true; i += 2;
                const r = ansiC(src, i); cur += r.text; i = r.end; continue;
            }
            if (c === "\\" && i + 1 < n && src[i + 1] !== "\n") { has = true; cur += src[i + 1]; i += 2; continue; }
            has = true; cur += c; i++;
        }
        push();
        return toks;
    }

    /* ---------- curl arg parsing ---------- */

    const NO_ARG = new Set([
        "--compressed","-k","--insecure","-L","--location","-s","--silent","-i","--include",
        "-v","--verbose","-g","--globoff","-f","--fail","--http1.1","--http2","--http2-prior-knowledge",
        "-N","--no-buffer","-S","--show-error","-#","--progress-bar","--path-as-is","--raw","-I","--head"
    ]);
    const ONE_ARG = new Set([
        "-H","--header","-X","--request","-d","--data","--data-raw","--data-binary","--data-ascii",
        "--data-urlencode","--json","-b","--cookie","-u","--user","-A","--user-agent","-e","--referer",
        "-F","--form","--form-string","-o","--output","--url","--connect-timeout","-m","--max-time",
        "--retry","--proxy","-x","--cacert","--cert","--key","-w","--write-out","-c","--cookie-jar",
        "--resolve","--interface","--limit-rate","-T","--upload-file"
    ]);

    function splitCurls(tokens) {
        const groups = [];
        let cur = null;
        for (const t of tokens) {
            const base = t.split(/[\\/]/).pop().toLowerCase();
            if (base === "curl" || base === "curl.exe") { cur = []; groups.push(cur); continue; }
            if (cur) cur.push(t);
        }
        return groups;
    }

    function parseCurl(args) {
        const req = { method: null, url: null, headers: [], data: [], form: [], upload: null, warnings: [] };
        for (let i = 0; i < args.length; i++) {
            const a = args[i];
            if (NO_ARG.has(a)) continue;
            if (a === "--url") { req.url = args[++i]; continue; }
            if (a === "-X" || a === "--request") { req.method = (args[++i] || "").toUpperCase(); continue; }
            if (a === "-H" || a === "--header") {
                const h = args[++i] || "";
                const k = h.indexOf(":");
                if (k > 0) req.headers.push([h.slice(0, k).trim(), h.slice(k + 1).trim()]);
                continue;
            }
            if (a === "-b" || a === "--cookie") { req.headers.push(["Cookie", args[++i] || ""]); continue; }
            if (a === "-A" || a === "--user-agent") { req.headers.push(["User-Agent", args[++i] || ""]); continue; }
            if (a === "-e" || a === "--referer") { req.headers.push(["Referer", args[++i] || ""]); continue; }
            if (a === "-u" || a === "--user") {
                const v = args[++i] || "";
                let enc; try { enc = btoa(unescape(encodeURIComponent(v))); } catch (_) { enc = ""; }
                req.headers.push(["Authorization", "Basic " + enc]);
                continue;
            }
            if (a === "--json") {
                req.data.push({ kind: "raw", value: args[++i] || "" });
                req.headers.push(["Content-Type", "application/json"]);
                req.headers.push(["Accept", "application/json"]);
                continue;
            }
            if (a === "-d" || a === "--data" || a === "--data-raw" || a === "--data-binary" || a === "--data-ascii") {
                const v = args[++i] || "";
                if (a !== "--data-raw" && v.startsWith("@")) req.data.push({ kind: "file", value: v.slice(1) });
                else req.data.push({ kind: "raw", value: v });
                continue;
            }
            if (a === "--data-urlencode") { req.data.push({ kind: "urlenc", value: args[++i] || "" }); continue; }
            if (a === "-F" || a === "--form" || a === "--form-string") { req.form.push(args[++i] || ""); continue; }
            if (a === "-T" || a === "--upload-file") { req.upload = args[++i] || ""; continue; }
            if (ONE_ARG.has(a)) { i++; continue; }
            if (a.startsWith("--") && a.includes("=")) continue;
            if (a.startsWith("-") && a.length > 1) { req.warnings.push(a); continue; }
            if (!req.url) req.url = a;
        }
        return req;
    }

    /* ---------- rendering ---------- */

    const BOUNDARY = "WebAppBoundary";

    function buildBody(req, pretty) {
        if (req.form.length) {
            const parts = req.form.map(f => {
                const eq = f.indexOf("=");
                const name = eq < 0 ? f : f.slice(0, eq);
                let val = eq < 0 ? "" : f.slice(eq + 1);
                const lines = ["--" + BOUNDARY];
                if (val.startsWith("@") || val.startsWith("<")) {
                    const path = val.slice(1).split(";")[0];
                    lines.push(`Content-Disposition: form-data; name="${name}"; filename="${path.split("/").pop()}"`, "", "< " + path);
                } else {
                    lines.push(`Content-Disposition: form-data; name="${name}"`, "", val);
                }
                return lines.join("\n");
            });
            return { body: parts.join("\n") + "\n--" + BOUNDARY + "--", ctype: "multipart/form-data; boundary=" + BOUNDARY };
        }
        if (req.upload) return { body: "< " + req.upload, ctype: null };
        if (!req.data.length) return { body: null, ctype: null };

        const fileOnly = req.data.length === 1 && req.data[0].kind === "file";
        if (fileOnly) return { body: "< " + req.data[0].value, ctype: null };

        const chunks = req.data.map(d => {
            if (d.kind === "file") return "< " + d.value;
            if (d.kind === "urlenc") {
                const eq = d.value.indexOf("=");
                return eq < 0 ? encodeURIComponent(d.value)
                    : d.value.slice(0, eq) + "=" + encodeURIComponent(d.value.slice(eq + 1));
            }
            return d.value;
        });
        let body = chunks.join("&");
        if (pretty) {
            const t = body.trim();
            if (t.startsWith("{") || t.startsWith("[")) {
                try { body = JSON.stringify(JSON.parse(t), null, 2); } catch (_) {}
            }
        }
        return { body, ctype: null };
    }

    function render(req, o) {
        const out = [];
        let url = (req.url || "").trim();
        if (o.host) url = hostify(url, o.hostVar);

        const { body, ctype } = buildBody(req, true);
        const method = req.method || (body !== null ? "POST" : "GET");

        out.push("###");
        if (o.name) {
            const nm = o.nameFor(autoName(url));
            if (nm) out.push("# @name " + nm);
        }

        if (o.query && url.includes("?")) {
            const [base, qs] = [url.slice(0, url.indexOf("?")), url.slice(url.indexOf("?") + 1)];
            out.push(method + " " + base);
            qs.split("&").forEach((p, idx) => out.push("    " + (idx ? "&" : "?") + p));
        } else {
            out.push(method + " " + url);
        }

        const seen = new Set();
        let hasCT = false;
        for (const [k, v] of req.headers) {
            const lk = k.toLowerCase();
            if (lk === "content-length") continue;   // stale once the body is reformatted
            const key = lk + "|" + v;
            if (seen.has(key)) continue;
            seen.add(key);
            if (lk === "content-type") { if (ctype) continue; hasCT = true; }
            out.push(k + ": " + v);
        }
        if (ctype) out.push("Content-Type: " + ctype);
        else if (!hasCT && body !== null && req.data.length) {
            const t = body.trim();
            if (t.startsWith("{") || t.startsWith("[")) out.push("Content-Type: application/json");
            else out.push("Content-Type: application/x-www-form-urlencoded");
        }

        if (body !== null) { out.push(""); out.push(body); }
        return out.join("\n");
    }


    /* =================== YAML (OpenAPI subset) =================== */

    function stripComment(s) {
        let q = null;
        for (let i = 0; i < s.length; i++) {
            const c = s[i];
            if (q) {
                if (c === "\\" && q === '"') { i++; continue; }
                if (c === q) q = null;
                continue;
            }
            if (c === '"' || c === "'") { q = c; continue; }
            if (c === "#" && (i === 0 || /\s/.test(s[i - 1]))) return s.slice(0, i);
        }
        return s;
    }

    function unquote(s) {
        s = s.trim();
        if (s.length > 1 && s[0] === '"' && s[s.length - 1] === '"') {
            try { return JSON.parse(s); }
            catch (_) { return s.slice(1, -1).replace(/\\"/g, '"').replace(/\\\\/g, "\\"); }
        }
        if (s.length > 1 && s[0] === "'" && s[s.length - 1] === "'") return s.slice(1, -1).replace(/''/g, "'");
        return s;
    }

    function flowParse(src, pos) {
        // returns {value, end}; src[pos] is '[' or '{'
        const open = src[pos], close = open === "[" ? "]" : "}";
        let i = pos + 1;
        const isArr = open === "[";
        const out = isArr ? [] : {};
        const readScalarTok = () => {
            let depth = 0, q = null, start = i, txt = "";
            while (i < src.length) {
                const c = src[i];
                if (q) { txt += c; if (c === q) q = null; i++; continue; }
                if (c === '"' || c === "'") { q = c; txt += c; i++; continue; }
                if (c === "[" || c === "{") { depth++; txt += c; i++; continue; }
                if (c === "]" || c === "}") { if (depth === 0) break; depth--; txt += c; i++; continue; }
                if (c === "," && depth === 0) break;
                if (c === ":" && depth === 0 && (src[i + 1] === " " || src[i + 1] === undefined)) break;
                txt += c; i++;
            }
            return txt;
        };
        for (;;) {
            while (i < src.length && /[\s,]/.test(src[i])) i++;
            if (i >= src.length) break;
            if (src[i] === close) { i++; break; }
            if (src[i] === "[" || src[i] === "{") {
                const r = flowParse(src, i); i = r.end;
                if (isArr) out.push(r.value);
                continue;
            }
            const tok = readScalarTok();
            if (!isArr) {
                let key = unquote(tok.trim());
                if (src[i] === ":") {
                    i++;

    function scalarValue(s) {

    function splitKey(line) {

    function parseYaml(text) {
        const L = text.replace(/\r/g, "").replace(/\t/g, "  ").split("\n");

        const indentOf = (s) => s.match(/^ */)[0].length;
        const clean = (s) => stripComment(s).replace(/\s+$/, "");
        const blank = (s) => !clean(s).trim();
        const skip = () => { while (i < L.length && blank(L[i])) i++; };

        // Copying from an IDE often drops the first line's leading spaces. If the line after it
        // sits deeper than the shallowest later line, those shallow lines are its siblings,
        // so give the first line their indentation back.
        const filled = [];
        L.forEach((l, k) => { if (!blank(l)) filled.push(k); });
        if (filled.length > 2) {
            const first = filled[0];
            const rest = filled.slice(1).map(k => indentOf(clean(L[k])));
            const shallow = Math.min.apply(null, rest);
            if (indentOf(clean(L[first])) < shallow && rest[0] > shallow) {
                L[first] = " ".repeat(shallow) + L[first].replace(/^ +/, "");
            }

        function blockScalar(marker, ind) {
            const fold = marker[0] === ">";
            const keep = marker.indexOf("+") >= 0, strip = marker.indexOf("-") >= 0;
            const lines = [];
            let base = null;
            while (i < L.length) {
                const l = L[i].replace(/\s+$/, "");

                const cur = indentOf(l);
                if (cur <= ind) break;
                if (base === null) base = cur;
                lines.push(l.slice(Math.min(base, cur)));

            while (lines.length && lines[lines.length - 1] === "") lines.pop();
            let s = fold ? lines.join(" ").replace(/\s+/g, " ").trim() : lines.join("\n");
            if (!strip && !fold) s += "\n";
            if (keep) s += "\n";

        function parseValue(rest, ind) {
            if (/^[|>][-+\d]*$/.test(rest)) return blockScalar(rest, ind);
            if (rest !== "") return scalarValue(rest);
            skip();
            if (i >= L.length) return null;
            const nxt = indentOf(clean(L[i]));
            const t = clean(L[i]).trim();
            if (nxt <= ind) {
                if (nxt === ind && (t === "-" || t.startsWith("- "))) return parseSeq(ind);
                return null;
            }
            if (t === "-" || t.startsWith("- ")) return parseSeq(nxt);
            return parseMap(nxt);

        function parseMap(ind) {
            const obj = {};
            for (;;) {
                skip();
                if (i >= L.length) break;
                const line = clean(L[i]);
                const cur = indentOf(line);
                if (cur < ind) break;
                const t = line.trim();
                if (cur === ind && (t === "-" || t.startsWith("- "))) break;
                if (cur > ind) { i++; continue; }
                const kv = splitKey(t);
                if (!kv) { i++; continue; }
                i++;
                obj[kv.key] = parseValue(kv.rest, ind);
            }
            return obj;
        }

        function parseSeq(ind) {
            const arr = [];
            for (;;) {
                skip();
                if (i >= L.length) break;
                const line = clean(L[i]);
                if (indentOf(line) !== ind) break;
                const t = line.trim();
                if (!(t === "-" || t.startsWith("- "))) break;
                const dash = line.indexOf("-");
                const after = line.slice(dash + 1);
                const lead = after.match(/^ */)[0].length;
                const itemIndent = dash + 1 + lead;
                const rest = after.trim();
                i++;
                if (rest === "") {
                    arr.push(parseValue("", ind));
                } else if (/^[|>][-+\d]*$/.test(rest)) {
                    arr.push(blockScalar(rest, ind));
                } else {
                    const kv = splitKey(rest);
                    if (kv) {
                        const obj = {};
                        obj[kv.key] = parseValue(kv.rest, itemIndent);
                        Object.assign(obj, parseMap(itemIndent));
                        arr.push(obj);
                    } else arr.push(scalarValue(rest));
                }
            }
            return arr;
        }

        skip();
        if (i >= L.length) return null;
        const first = clean(L[i]).trim();
        const ind0 = indentOf(clean(L[i]));
        return (first === "-" || first.startsWith("- ")) ? parseSeq(ind0) : parseMap(ind0);
    }

    function parseSpec(text) {
        const t = text.trim();

            seen.add(node);

                emitted.add(lk);

    function securityHeaders(doc, op) {

    jt("LocalTime OffsetTime Duration Period ZoneId ZoneOffset TimeZone Locale Currency YearMonth Year MonthDay", { type:"string" });
    jt("URI URL", { type:"string", format:"uri" });
    jt("MultipartFile Part FilePart Resource InputStreamResource ByteArrayResource FileSystemResource UrlResource " +
        "ClassPathResource StreamingResponseBody InputStream File", { type:"string", format:"binary" });
    jt("JsonNode ObjectNode ArrayNode Object void Void", {});

    var JAVA_COLLS = nameSet("List ArrayList LinkedList Collection Iterable Set HashSet LinkedHashSet TreeSet SortedSet " +
        "NavigableSet Stream Queue Deque ArrayDeque Vector CopyOnWriteArrayList EnumSet Flux Observable Flowable");
    var JAVA_MAPS = nameSet("Map HashMap LinkedHashMap TreeMap SortedMap NavigableMap ConcurrentHashMap ConcurrentMap " +
        "MultiValueMap LinkedMultiValueMap EnumMap Properties");
    var JAVA_WRAPS = nameSet("ResponseEntity HttpEntity RequestEntity Mono CompletableFuture CompletionStage Future " +
        "ListenableFuture Callable DeferredResult WebAsyncTask Optional Supplier EntityModel Single Maybe");
    var SPRING_SKIP_TYPES = nameSet("HttpServletRequest HttpServletResponse ServletRequest ServletResponse HttpSession " +
        "WebRequest NativeWebRequest ServerWebExchange ServerHttpRequest ServerHttpResponse Principal Authentication " +
        "Model ModelMap ModelAndView RedirectAttributes BindingResult Errors Locale TimeZone ZoneId UriComponentsBuilder " +
        "SessionStatus HttpMethod HttpHeaders Reader Writer OutputStream InputStream SseEmitter");
    var SPRING_IGNORE_ANNS = nameSet("RequestAttribute SessionAttribute AuthenticationPrincipal CurrentSecurityContext " +
        "Value MatrixVariable");
    var HTTP_STATUS = { OK:"200", CREATED:"201", ACCEPTED:"202", NON_AUTHORITATIVE_INFORMATION:"203", NO_CONTENT:"204",
        RESET_CONTENT:"205", PARTIAL_CONTENT:"206", MULTI_STATUS:"207", IM_USED:"226", FOUND:"302", SEE_OTHER:"303" };

    function isP(t, v){ return !!t && t.t === "p" && t.v === v; }
    function clone(v){ return JSON.parse(JSON.stringify(v)); }

    /* ---------- java tokenizer ---------- */

    function unescJava(s){
        var map = { n:"\n", t:"\t", r:"\r", b:"\b", f:"\f", s:" ", "0":"\0" };
        return s.replace(/\\(?:u+([0-9a-fA-F]{4})|(.))/g, function(m, hex, c){
            if(hex) return String.fromCharCode(parseInt(hex, 16));
            return c in map ? map[c] : c;
        });
    }

    var JAVA_ID = /[A-Za-z_$\u00C0-\uFFFF][\w$\u00C0-\uFFFF]*/y;
    var JAVA_NUM = /\d[\w.]*/y;

    function javaTokens(src){
        var out = [], i = 0, n = src.length, m;
        while(i < n){
            var c = src[i];
            if(/\s/.test(c)){ i++; continue; }
            if(c === "/" && src[i + 1] === "/"){ var nl = src.indexOf("\n", i); i = nl < 0 ? n : nl; continue; }
            if(c === "/" && src[i + 1] === "*"){
                var e = src.indexOf("*/", i + 2);
                if(e < 0) e = n;
                if(src[i + 2] === "*" && e > i + 2) out.push({ t:"doc", v: src.slice(i + 3, e) });
                i = e + 2; continue;
            }
            if(src.startsWith('"""', i)){
                var e2 = src.indexOf('"""', i + 3);
                if(e2 < 0) e2 = n;
                out.push({ t:"str", v: unescJava(src.slice(i + 3, e2).replace(/^[ \t]*\r?\n/, "")) });
                i = e2 + 3; continue;
            }
            if(c === '"' || c === "'"){
                var j = i + 1;
                while(j < n && src[j] !== c && src[j] !== "\n") j += src[j] === "\\" ? 2 : 1;
                out.push({ t: c === '"' ? "str" : "chr", v: unescJava(src.slice(i + 1, j)) });
                i = j + 1; continue;
            }
            JAVA_ID.lastIndex = i;
            if((m = JAVA_ID.exec(src))){ out.push({ t:"id", v: m[0] }); i += m[0].length; continue; }
            JAVA_NUM.lastIndex = i;
            if((m = JAVA_NUM.exec(src))){ out.push({ t:"num", v: m[0] }); i += m[0].length; continue; }
            out.push({ t:"p", v: c }); i++;
        }
        return out;
    }

    function matchClose(toks, i){
        var d = 0;
        for(var j = i; j < toks.length; j++){
            var t = toks[j];
            if(t.t !== "p") continue;
            if("([{".indexOf(t.v) >= 0) d++;
            else if(")]}".indexOf(t.v) >= 0 && --d === 0) return j;
        }
        return toks.length;
    }

    function skipAngles(toks, i){
        var d = 0;
        for(var j = i; j < toks.length; j++){
            if(isP(toks[j], "<")) d++;
            else if(isP(toks[j], ">") && --d === 0) return j + 1;
        }
        return toks.length;
    }

    function splitTop(toks, sep, angles){
        var parts = [[]], d = 0, a = 0;
        toks.forEach(function(t){
            if(t.t === "p"){
                if("([{".indexOf(t.v) >= 0) d++;
                else if(")]}".indexOf(t.v) >= 0) d--;
                else if(angles && t.v === "<") a++;
                else if(angles && t.v === ">") a--;
                else if(t.v === sep && !d && !a){ parts.push([]); return; }
            }
            parts[parts.length - 1].push(t);
        });
        return parts.filter(function(p){ return p.length; });
    }

    // @Foo(...) becomes one token holding its (already grouped) arguments
    function groupAnnotations(toks){
        var out = [];
        for(var i = 0; i < toks.length; i++){
            var t = toks[i];
            if(!(isP(t, "@") && toks[i + 1] && toks[i + 1].t === "id")){ out.push(t); continue; }
            if(toks[i + 1].v === "interface"){ out.push(toks[i + 1]); i++; continue; }
            var name = toks[++i].v;
            while(isP(toks[i + 1], ".") && toks[i + 2] && toks[i + 2].t === "id"){ name = toks[i + 2].v; i += 2; }
            var ann = { t:"ann", name: name, args: null };
            if(isP(toks[i + 1], "(")){
                var close = matchClose(toks, i + 1);
                ann.args = groupAnnotations(toks.slice(i + 2, close));
                i = close;
            }
            out.push(ann);
        }
        return out;
    }

    /* ---------- declarations ---------- */

    function parseType(toks){
        var i = 0;
        function one(){
            var start = i;
            while(toks[i] && toks[i].t === "ann") i++;
            if(isP(toks[i], "?")){
                i++;
                if(toks[i] && (toks[i].v === "extends" || toks[i].v === "super")){ i++; return one(); }
                return { name:"Object", args:[], dims:0 };
            }
            var name = toks[i] && toks[i].t === "id" ? toks[i++].v : "Object";
            var args = [];
            for(;;){
                if(isP(toks[i], "<")){
                    i++; args = [];
                    while(i < toks.length && !isP(toks[i], ">")){
                        if(isP(toks[i], ",")){ i++; continue; }
                        var before = i;
                        args.push(one());
                        if(i === before) i++;
                    }
                    i++;
                }
                if(isP(toks[i], ".") && toks[i + 1] && toks[i + 1].t === "id"){ name = toks[i + 1].v; args = []; i += 2; continue; }
                break;
            }
            var dims = 0;
            for(;;){
                if(isP(toks[i], "[")){ dims++; i += 2; continue; }
                if(isP(toks[i], ".") && isP(toks[i + 1], ".") && isP(toks[i + 2], ".")){ dims++; i += 3; continue; }
                break;
            }
            if(i === start) i++;
            return { name: name, args: args, dims: dims };
        }
        return one();
    }

    var TYPE_TOK = /^[.<>,?\[\]&]$/;
    function typeToksOk(toks){
        return toks.length && toks.every(function(t){ return t.t === "id" || t.t === "ann" || (t.t === "p" && TYPE_TOK.test(t.v)); });
    }

    function declOf(toks){
        var anns = [], rest = [];
        toks.forEach(function(t){
            if(t.t === "ann") anns.push(t);
            else if(t.t === "doc" || (t.t === "id" && JAVA_MODS[t.v])) return;
            else rest.push(t);
        });
        var last = rest[rest.length - 1];
        if(rest.length < 2 || last.t !== "id") return null;
        var typeToks = rest.slice(0, -1);
        if(!typeToksOk(typeToks)) return null;
        return { name: last.v, type: parseType(typeToks), anns: anns };
    }

    function methodOf(stmt, paramToks){
        var rest = stmt.filter(function(t){ return !(t.t === "id" && JAVA_MODS[t.v]) && t.t !== "doc" && t.t !== "ann"; });
        if(isP(rest[0], "<")) rest = rest.slice(skipAngles(rest, 0));
        var name = rest[rest.length - 1];
        if(rest.length < 2 || name.t !== "id") return null;     // constructors, calls
        var typeToks = rest.slice(0, -1);
        if(!typeToksOk(typeToks)) return null;
        return { name: name.v, ret: parseType(typeToks), params: splitTop(paramToks, ",", true).map(declOf).filter(Boolean) };
    }

    function enumConstants(toks, i, def){
        var expect = true;
        while(i < toks.length){
            var t = toks[i];
            if(isP(t, ";")) return i + 1;
            if(isP(t, "}")) return i;
            if(isP(t, "(") || isP(t, "{")){ i = matchClose(toks, i) + 1; continue; }
            if(isP(t, ",")) expect = true;
            else if(t.t === "id" && expect){ def.enumValues.push(t.v); expect = false; }
            i++;
        }
        return i;
    }

    // classes with their fields and methods; a bare method pasted without a class lands in the root
    function walkJava(toks){
        var root = { name: null, kind: "root", anns: [], fields: [], methods: [], enumValues: [] };
        var classes = [root], stack = [root];
        var stmt = [], anns = [], doc = null, i = 0, n = toks.length;
        function reset(){ stmt = []; anns = []; doc = null; }
        function addField(cls, init){
            if(!stmt.length || (cls.kind === "root" && !init)) return;
            var d = declOf(stmt);
            if(!d) return;
            d.anns = anns.concat(d.anns);
            d.isStatic = cls.kind === "interface" || stmt.some(function(t){ return t.t === "id" && t.v === "static"; });
            d.init = init;
            d.doc = doc;
            cls.fields.push(d);
        }
        while(i < n){
            var t = toks[i], cls = stack[stack.length - 1];
            if(t.t === "doc"){ doc = t.v; i++; continue; }
            if(t.t === "ann"){ anns.push(t); i++; continue; }
            if(t.t === "id" && /^(class|interface|enum|record)$/.test(t.v) && toks[i + 1] && toks[i + 1].t === "id"
                && !isP(stmt[stmt.length - 1], ".")){
                var def = { name: toks[i + 1].v, kind: t.v, anns: anns, doc: doc, ext: null, fields: [], methods: [], enumValues: [] };
                i += 2;
                if(isP(toks[i], "<")) i = skipAngles(toks, i);
                if(def.kind === "record" && isP(toks[i], "(")){
                    var rc = matchClose(toks, i);
                    splitTop(toks.slice(i + 1, rc), ",", true).forEach(function(p){ var f = declOf(p); if(f) def.fields.push(f); });
                    i = rc + 1;
                }
                while(i < n && !isP(toks[i], "{") && !isP(toks[i], ";")){
                    if(toks[i].t === "id" && toks[i].v === "extends" && def.kind === "class"){
                        var k = i + 1;
                        while(toks[k] && toks[k].t === "id"){ def.ext = toks[k].v; if(isP(toks[k + 1], ".")) k += 2; else break; }
                        i = k + 1; continue;
                    }
                    i++;
                }
                classes.push(def);
                if(isP(toks[i], "{")){
                    i++;
                    stack.push(def);
                    if(def.kind === "enum") i = enumConstants(toks, i, def);
                } else i++;
                reset(); continue;
            }
            if(t.t === "p"){
                if(t.v === "{"){ i = matchClose(toks, i) + 1; reset(); continue; }      // initializer block
                if(t.v === "}"){ if(stack.length > 1) stack.pop(); i++; reset(); continue; }
                if(t.v === ";"){ addField(cls, null); i++; reset(); continue; }
                if(t.v === "="){
                    var j = i + 1;
                    while(j < n && !isP(toks[j], ";") && !isP(toks[j], "}")){
                        if(toks[j].t === "p" && "([{".indexOf(toks[j].v) >= 0) j = matchClose(toks, j);
                        j++;
                    }
                    addField(cls, toks.slice(i + 1, j));
                    i = isP(toks[j], ";") ? j + 1 : j; reset(); continue;
                }
                if(t.v === "("){
                    var pc = matchClose(toks, i);
                    var m = methodOf(stmt, toks.slice(i + 1, pc));
                    i = pc + 1;
                    // throws clause; a signature pasted without a body stops at the next declaration
                    while(i < n && !isP(toks[i], "{") && !isP(toks[i], ";") && !isP(toks[i], "}")
                    && toks[i].t !== "ann" && toks[i].t !== "doc" && !(toks[i].t === "id" && JAVA_MODS[toks[i].v])){
                        if(isP(toks[i], "(")) i = matchClose(toks, i);
                        i++;
                    }
                    if(isP(toks[i], "{")) i = matchClose(toks, i) + 1;
                    else if(isP(toks[i], ";")) i++;
                    if(m){ m.anns = anns; m.doc = doc; cls.methods.push(m); }
                    reset(); continue;
                }
            }
            stmt.push(t); i++;
        }
        return classes;
    }

    /* ---------- annotation values ---------- */

    function isIdChain(p){
        if(!p.length || p.length % 2 === 0) return false;
        return p.every(function(t, k){ return k % 2 ? isP(t, ".") : t.t === "id"; });
    }

    // → { s } string, { sym } unresolved name, { lit } boolean/number, { ann } nested annotation
    function evalExpr(toks, ctx, depth){
        depth = depth || 0;
        while(toks.length >= 2 && isP(toks[0], "(") && matchClose(toks, 0) === toks.length - 1) toks = toks.slice(1, -1);
        var pieces = splitTop(toks, "+");
        if(pieces.length > 1){
            var s = "";
            pieces.forEach(function(p){
                var r = evalExpr(p, ctx, depth);
                if(r.s != null) s += r.s;
                else if(r.sym){ s += "{" + r.sym + "}"; ctx.unresolved[r.sym] = 1; }
                else if(r.lit !== undefined) s += String(r.lit);
            });
            return { s: s };
        }
        var p = pieces[0] || [];
        if(p.length === 1){
            var t = p[0];
            if(t.t === "str" || t.t === "chr") return { s: t.v };
            if(t.t === "num") return { lit: t.v };
            if(t.t === "ann") return { ann: t };
            if(t.t === "id" && (t.v === "true" || t.v === "false")) return { lit: t.v === "true" };
        }
        if(isIdChain(p)){
            var last = p[p.length - 1].v;
            var full = p.length >= 3 ? p[p.length - 3].v + "." + last : last;
            var f = ctx.consts[full] || ctx.consts[last];
            if(f && !f.busy && depth < 10){
                f.busy = true;
                var r = evalExpr(f.init, ctx, depth + 1);
                f.busy = false;
                if(r.s != null) return { s: r.s };
            }
            return { sym: last };
        }
        return {};
    }

    function annAttrs(ann){
        if(ann._attrs) return ann._attrs;
        var attrs = {};
        splitTop(ann.args || [], ",").forEach(function(part){
            if(part.length > 2 && part[0].t === "id" && isP(part[1], "=")) attrs[part[0].v] = part.slice(2);
            else attrs.value = part;
        });
        return (ann._attrs = attrs);
    }

    function annItems(ann, keys, ctx){
        if(!ann) return [];
        var attrs = annAttrs(ann);
        for(var k = 0; k < keys.length; k++){
            var v = attrs[keys[k]];
            if(!v) continue;
            if(isP(v[0], "{") && matchClose(v, 0) === v.length - 1){
                return splitTop(v.slice(1, -1), ",").map(function(x){ return evalExpr(x, ctx); });
            }
            return [evalExpr(v, ctx)];
        }
        return [];
    }

    function annStr(ann, keys, ctx){
        var it = annItems(ann, keys, ctx)[0];
        if(!it) return null;
        if(it.s != null) return it.s;
        if(it.lit !== undefined) return String(it.lit);
        return it.sym || null;
    }

    function annBool(ann, key, ctx, dflt){
        var it = annItems(ann, [key], ctx)[0];
        return it && typeof it.lit === "boolean" ? it.lit : dflt;
    }

    function findAnn(anns, name){
        for(var k = 0; anns && k < anns.length; k++) if(anns[k].name === name) return anns[k];
        return null;
    }

    function mediaOf(it){
        if(it.s != null) return it.s;
        if(!it.sym) return null;
        var k = it.sym.replace(/_VALUE$/, "");
        var special = { ALL:"*/*", APPLICATION_FORM_URLENCODED:"application/x-www-form-urlencoded", APPLICATION_JSON_UTF8:"application/json;charset=UTF-8", APPLICATION_NDJSON:"application/x-ndjson",
            APPLICATION_PROBLEM_JSON:"application/problem+json", APPLICATION_PROBLEM_XML:"application/problem+xml",
            APPLICATION_STREAM_JSON:"application/stream+json", APPLICATION_ATOM_XML:"application/atom+xml",
            APPLICATION_RSS_XML:"application/rss+xml", APPLICATION_XHTML_XML:"application/xhtml+xml" };
        if(special[k]) return special[k];
        var parts = k.toLowerCase().split("_");
        return parts.length > 1 ? parts[0] + "/" + parts.slice(1).join("-") : null;
    }

    function mediaList(ann, key, ctx){
        return annItems(ann, [key], ctx).map(mediaOf).filter(Boolean);
    }

    function pathList(ann, ctx){
        return annItems(ann, ["value", "path"], ctx).map(function(it){
            if(it.s != null) return it.s;
            if(it.sym){ ctx.unresolved[it.sym] = 1; return "{" + it.sym + "}"; }
            return "";
        });
    }

    function springPath(a, b){
        var ph = function(s){
            return String(s).replace(/\$\{([^}:]+)(?::([^}]*))?\}/g, function(m, k, d){
                return d != null ? d : "{" + k.trim().replace(/\W+/g, "_") + "}";
            });
        };
        var s = "/" + ph(a) + "/" + ph(b), out = "", i = 0;
        while(i < s.length){
            if(s[i] !== "{"){ out += s[i++]; continue; }
            var d = 0, j = i;
            for(; j < s.length; j++){ if(s[j] === "{") d++; else if(s[j] === "}" && --d === 0) break; }
            out += "{" + s.slice(i + 1, j).split(":")[0].trim() + "}";    // {id:\d+} → {id}
            i = j + 1;
        }
        out = out.replace(/\/{2,}/g, "/");
        if(out.length > 1) out = out.replace(/\/$/, "");
        return out || "/";
    }

    function headerize(sym){
        return sym.toLowerCase().split("_").map(function(w){ return w ? w[0].toUpperCase() + w.slice(1) : w; }).join("-");
    }

    function docText(raw){
        if(!raw) return {};
        var body = [];
        raw.split("\n").some(function(l){
            l = l.replace(/^\s*\*?\s?/, "").replace(/\s+$/, "");
            if(/^@\w+/.test(l.trim())) return true;
            body.push(l);
        });
        var text = body.join("\n")
            .replace(/\{@(?:code|link|linkplain|literal|value)\s+([^}]*)\}/g, "$1")
            .replace(/<\/?(?:p|br|b|i|em|strong|code|pre|ul|ol|li)\s*\/?>/gi, "")
            .trim();
        if(!text) return {};
        var ls = text.split("\n");
        return { summary: ls[0].trim(), description: ls.slice(1).join("\n").trim() || null };
    }

    /* ---------- types → schemas ---------- */

    var OBJ_TYPE = { name:"Object", args:[], dims:0 };

    function unwrapOpt(t){
        if(t.name === "Optional" && !t.dims) return { type: t.args[0] || OBJ_TYPE, optional: true };
        return { type: t, optional: /^Optional(Int|Long|Double)$/.test(t.name) };
    }

    function isFileSchema(s){
        return !!s && (s.format === "binary" || (s.type === "array" && isFileSchema(s.items)));
    }

    function isScalarSchema(s){
        if(!s || s.$ref || isFileSchema(s)) return false;
        if(s.type === "array") return isScalarSchema(s.items);
        return ["string", "integer", "number", "boolean"].indexOf(s.type) >= 0;
    }

    function typedFor(s, v){
        var t = s && s.type;
        if(t === "integer" && /^-?\d+$/.test(v)) return Number.isSafeInteger(+v) ? +v : v;
        if(t === "number" && /^-?\d+(\.\d+)?$/.test(v)) return parseFloat(v);
        if(t === "boolean" && /^(true|false)$/.test(v)) return v === "true";
        return v;
    }

    // description / example from swagger annotations, where a $ref doesn't swallow them
    function decorate(s, anns, ctx){
        if(!s || s.$ref) return s;
        [["Schema", "description"], ["Parameter", "description"], ["ApiModelProperty", "value"], ["ApiParam", "value"]].forEach(function(pair){
            var a = findAnn(anns, pair[0]);
            if(!a) return;
            var d = annStr(a, [pair[1]], ctx), ex = annStr(a, ["example"], ctx);
            if(d && !s.description) s.description = d;
            if(ex != null && !("example" in s)) s.example = typedFor(s, ex);
        });
        return s;
    }

    function schemaOf(t, ctx){
        if(!t) return {};
        if(t.dims){
            if(t.dims === 1 && /^(byte|Byte)$/.test(t.name)) return { type:"string", format:"binary" };
            return { type:"array", items: schemaOf({ name: t.name, args: t.args, dims: t.dims - 1 }, ctx) };
        }
        var n = t.name, a = t.args || [];
        if(JAVA_WRAPS[n]) return a[0] ? schemaOf(a[0], ctx) : {};
        if(JAVA_COLLS[n]){
            var arr = { type:"array", items: a[0] ? schemaOf(a[0], ctx) : {} };
            if(/Set$/.test(n)) arr.uniqueItems = true;
            return arr;
        }
        if(JAVA_MAPS[n]) return { type:"object", additionalProperties: a[1] ? schemaOf(a[1], ctx) : {} };
        if(n === "Page" || n === "Slice"){
            return { type:"object", properties: {
                    content: { type:"array", items: a[0] ? schemaOf(a[0], ctx) : {} },
                    totalElements: { type:"integer", format:"int64" }, totalPages: { type:"integer", format:"int32" },
                    number: { type:"integer", format:"int32" }, size: { type:"integer", format:"int32" } } };
        }
        if(JAVA_SCALARS[n]) return clone(JAVA_SCALARS[n]);
        var def = ctx.classes[n];
        if(def && def.kind === "enum") return { type:"string", enum: def.enumValues.slice() };
        if(/^[A-Z]\d?$/.test(n)) return {};                                  // a type variable
        if(!ctx.schemas[n]){
            var sch = ctx.schemas[n] = { type:"object" };
            if(def && def.kind !== "interface"){
                var props = {}, req = [];
                beanFields(def, ctx).forEach(function(f){ props[f.name] = f.schema; if(f.required) req.push(f.name); });
                if(Object.keys(props).length) sch.properties = props;
